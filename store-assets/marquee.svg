<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <linearGradient id="marquee-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="url(#marquee-bg)"/>

  <!-- Subtle geometric decorations -->
  <circle cx="1280" cy="80" r="120" fill="white" opacity="0.04"/>
  <circle cx="1320" cy="460" r="80" fill="white" opacity="0.03"/>
  <circle cx="120" cy="480" r="60" fill="white" opacity="0.03"/>
  <line x1="0" y1="420" x2="200" y2="420" stroke="white" stroke-width="1" opacity="0.08"/>
  <line x1="1200" y1="140" x2="1400" y2="140" stroke="white" stroke-width="1" opacity="0.08"/>
  <rect x="60" y="60" width="2" height="40" fill="white" opacity="0.06"/>
  <rect x="1340" y="300" width="2" height="40" fill="white" opacity="0.06"/>

  <!-- Logo mark (4 rounded squares) -->
  <g transform="translate(420, 200)">
    <rect x="0" y="0" width="48" height="48" rx="8" ry="8" fill="white" opacity="0.9"/>
    <rect x="60" y="0" width="48" height="48" rx="8" ry="8" fill="white" opacity="0.7"/>
    <rect x="0" y="60" width="48" height="48" rx="8" ry="8" fill="white" opacity="0.55"/>
    <rect x="60" y="60" width="48" height="48" rx="8" ry="8" fill="white" opacity="0.4"/>
  </g>

  <!-- App name -->
  <text x="570" y="252" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white" letter-spacing="-1">ResultBoard</text>

  <!-- Tagline -->
  <text x="570" y="310" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="white" opacity="0.8">Turn Google results into structured research</text>

  <!-- Feature highlights -->
  <g transform="translate(570, 360)" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="white" opacity="0.6">
    <circle cx="0" cy="-5" r="3" fill="white" opacity="0.6"/>
    <text x="12" y="0">Classify results instantly</text>
    <circle cx="220" cy="-5" r="3" fill="white" opacity="0.6"/>
    <text x="232" y="0">Side panel research board</text>
    <circle cx="440" cy="-5" r="3" fill="white" opacity="0.6"/>
    <text x="452" y="0">Compare and organize</text>
  </g>
</svg>
