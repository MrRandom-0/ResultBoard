<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Chrome browser frame -->
  <rect width="1280" height="800" fill="#f8f9fc"/>

  <!-- Title bar -->
  <rect width="1280" height="40" fill="#e8eaed"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c940"/>

  <!-- Tab -->
  <rect x="80" y="6" width="200" height="28" rx="8" ry="8" fill="#ffffff"/>
  <text x="110" y="25" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#5f6368">Google - research tools</text>

  <!-- Address bar -->
  <rect width="1280" height="36" y="40" fill="#ffffff"/>
  <rect x="180" y="48" width="920" height="20" rx="10" ry="10" fill="#f1f3f4"/>
  <text x="210" y="62" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#5f6368">google.com/search?q=best+project+management+tools+2024</text>
  <line x1="0" y1="76" x2="1280" y2="76" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Google search results area -->
  <g transform="translate(180, 100)">
    <!-- Google logo area -->
    <text x="0" y="30" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#4285f4">G</text>
    <text x="14" y="30" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#ea4335">o</text>
    <text x="30" y="30" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#fbbc05">o</text>
    <text x="46" y="30" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#4285f4">g</text>
    <text x="62" y="30" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#34a853">l</text>
    <text x="72" y="30" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#ea4335">e</text>

    <!-- Search box -->
    <rect x="0" y="50" width="560" height="40" rx="20" ry="20" fill="white" stroke="#dfe1e5" stroke-width="1"/>
    <text x="20" y="75" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#202124">best project management tools 2024</text>

    <!-- Result 1 -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#4d5156">www.techreviews.com</text>
      <text x="0" y="22" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#1a0dab">Top 10 Project Management Tools Compared - 2024 Guide</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4d5156">Comprehensive review of the best project management solutions...</text>

      <!-- ResultBoard classification buttons -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="60" height="26" rx="13" ry="13" fill="#22c55e" opacity="0.9"/>
        <text x="14" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Keep</text>
        <rect x="68" y="0" width="64" height="26" rx="13" ry="13" fill="#f59e0b" opacity="0.9"/>
        <text x="79" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Maybe</text>
        <rect x="140" y="0" width="64" height="26" rx="13" ry="13" fill="#ef4444" opacity="0.9"/>
        <text x="152" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Reject</text>
      </g>
    </g>

    <!-- Result 2 -->
    <g transform="translate(0, 220)">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#4d5156">www.producthunt.com</text>
      <text x="0" y="22" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#1a0dab">Best PM Tools Voted by the Community - Product Hunt</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4d5156">Discover community-rated project management tools with real user reviews...</text>

      <!-- ResultBoard classification buttons -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="60" height="26" rx="13" ry="13" fill="#22c55e" opacity="0.9"/>
        <text x="14" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Keep</text>
        <rect x="68" y="0" width="64" height="26" rx="13" ry="13" fill="#f59e0b" opacity="0.9"/>
        <text x="79" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Maybe</text>
        <rect x="140" y="0" width="64" height="26" rx="13" ry="13" fill="#ef4444" opacity="0.9"/>
        <text x="152" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Reject</text>
      </g>
    </g>

    <!-- Result 3 (already classified - Keep) -->
    <g transform="translate(0, 320)">
      <rect x="-10" y="-12" width="800" height="72" rx="6" ry="6" fill="#22c55e" opacity="0.06"/>
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#4d5156">www.zapier.com/blog</text>
      <text x="0" y="22" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#1a0dab">The Best Project Management Software in 2024 - Zapier</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4d5156">We tested dozens of PM apps to find the best for different needs...</text>

      <!-- Classified indicator -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="80" height="26" rx="13" ry="13" fill="#22c55e"/>
        <text x="14" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="white">Kept</text>
        <text x="42" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="white" opacity="0.8">&#10003;</text>
      </g>
    </g>

    <!-- Result 4 -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#4d5156">www.g2.com</text>
      <text x="0" y="22" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#1a0dab">Project Management Software Reviews 2024 | G2</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4d5156">Compare the best project management software with verified user reviews...</text>

      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="60" height="26" rx="13" ry="13" fill="#22c55e" opacity="0.9"/>
        <text x="14" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Keep</text>
        <rect x="68" y="0" width="64" height="26" rx="13" ry="13" fill="#f59e0b" opacity="0.9"/>
        <text x="79" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Maybe</text>
        <rect x="140" y="0" width="64" height="26" rx="13" ry="13" fill="#ef4444" opacity="0.9"/>
        <text x="152" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white">Reject</text>
      </g>
