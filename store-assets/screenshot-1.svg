  <!-- ResultBoard badge -->
  <g transform="translate(1060, 90)">
    <rect x="0" y="0" width="180" height="32" rx="16" ry="16" fill="#6366f1" opacity="0.95"/>
    <rect x="10" y="8" width="8" height="8" rx="2" ry="2" fill="white" opacity="0.9"/>
    <rect x="20" y="8" width="8" height="8" rx="2" ry="2" fill="white" opacity="0.6"/>
    <rect x="10" y="18" width="8" height="8" rx="2" ry="2" fill="white" opacity="0.6"/>
    <rect x="20" y="18" width="8" height="8" rx="2" ry="2" fill="white" opacity="0.4"/>
    <text x="38" y="21" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">ResultBoard Active</text>
