<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#tile-bg)"/>

  <!-- Subtle decoration -->
  <circle cx="400" cy="40" r="60" fill="white" opacity="0.03"/>
  <circle cx="40" cy="250" r="40" fill="white" opacity="0.03"/>

  <!-- Logo mark centered -->
  <g transform="translate(144, 80)">
    <rect x="0" y="0" width="32" height="32" rx="5" ry="5" fill="white" opacity="0.9"/>
    <rect x="42" y="0" width="32" height="32" rx="5" ry="5" fill="white" opacity="0.7"/>
    <rect x="0" y="42" width="32" height="32" rx="5" ry="5" fill="white" opacity="0.55"/>
    <rect x="42" y="42" width="32" height="32" rx="5" ry="5" fill="white" opacity="0.4"/>
  </g>

  <!-- App name -->
  <text x="232" y="118" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white" letter-spacing="-0.5">ResultBoard</text>

  <!-- Tagline -->
  <text x="220" y="200" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400" fill="white" opacity="0.75" text-anchor="middle">
    <tspan x="220" dy="0">Turn Google results into</tspan>
    <tspan x="220" dy="20">structured research</tspan>
  </text>
</svg>
